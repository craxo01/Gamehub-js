<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="./bingo/stylebingo.css" />
    <script defer src="./bingo/scriptbingo.js"></script>
    <title>Bingo</title>
  </head>
  <body>
    <h1 class="header-text">Please choose a level.</h1>
    <a class="exit">Exit</a>
    <main class="container">
      <section class="level">
        <div class="item easy">Easy</div>
        <div class="item normal">Normal</div>
        <div class="item hard">Hard</div>
      </section>
      <section class="number">
        <div class="item 100">100</div>
        <div class="item 200">200</div>
        <div class="item 300">300</div>
      </section>
      <section class="turn">
        <div class="item you">You</div>
        <div class="item me">Me</div>
      </section>
      <section class="game-container">
        <div class="palyer  back1">
          <span class="name1">Palyer 1</span>
          <span class="firstnumber">0</span>
          <span class="timer1">timer : 10</span>
        </div>
        <div class="palyer  back2">
          <span class="name2">Palyer 2</span>
          <span class="secondnumber">0</span>
          <span class="timer2">timer : 10</span>
        </div>
        <div class="option bingo">bingo</div>
        <div class="option org-number">0</div>
        <div class="again">Play again</div>
      </section>
    </main>
    
  </body>
</html>
