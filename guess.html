<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./guess/guess.css" />
    <script defer src="./guess/guess.js"></script>
    <title>Guess My Number!</title>
  </head>
  <body>
    <header class="header">
      <div class="left-header">
        <button class="again">Again!</button>
        <a class="exit" >Exit</a>
      </div>
      
      <p class="between">(Between 1 and 100)</p>
    </header>
    <main>
      <h1 class="guess">Guess My Number!</h1>
      <div class="orgnumber">?</div>
      <section class="flex-org-main">
       
        </div>
        <div class="left">
          <input type="number" class="input" />
          <button class="cheak">Cheak!</button>
        </div>
         <div class="right">
          <p class="text">Start guessing...</p>
          <div class="rightup">
            <p>💯 score: <span class="score">20</span></p>
            <p>🥇 Highscore: <span class="highscore">0</span></p>
          </div>
      </section>
    </main>
  </body>
</html>
